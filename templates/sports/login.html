{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
  <p class="eyebrow">Club roster</p>
  <h1>Log in</h1>
  <div class="panel">
    {% include '_form_errors.html' %}
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit">Log in</button>
    </form>
    <p>New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
  </div>
{% endblock %}
