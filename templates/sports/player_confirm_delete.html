{% extends 'base.html' %}
{% block title %}Delete {{ object }}{% endblock %}
{% block content %}
  <p class="eyebrow">Roster management</p>
  <h1>Delete {{ object }}?</h1>
  <div class="panel">
    <p>A deleted player cannot be restored.</p>
    <form method="post" class="actions">
      {% csrf_token %}
      <button type="submit" class="btn-danger">Yes, delete</button>
      <a class="btn btn-quiet" href="{% url 'player_detail' object.pk %}">Cancel</a>
    </form>
  </div>
{% endblock %}
